<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>11 tháng yêu nhau – 13/10</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500&family=Lora:ital,wght@0,500;1,500;1,600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --night: #1a1230;
            --plum: #2c1a4d;
            --moon: #ffe8b6;
            --dim: #3a2a62;
            --rose: #ff8fa3;
            --mist: #cbbcf2;
            --text: #f4eefc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            font-family: "Be Vietnam Pro", system-ui, sans-serif;
            font-weight: 300;
            color: var(--text);
            background:
                radial-gradient(ellipse at 50% -10%, #4a2b7a 0%, transparent 55%),
                linear-gradient(180deg, var(--night), var(--plum) 120%);
            background-attachment: fixed;
            overflow-x: hidden;
        }

        canvas#sky {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        main {
            position: relative;
            z-index: 1;
            max-width: 860px;
            margin: 0 auto;
            padding: 72px 24px 64px;
            text-align: center;
        }

        .date {
            color: var(--mist);
            font-size: 1rem;
            letter-spacing: .04em;
        }

        h1 {
            font-family: "Lora", serif;
            font-style: italic;
            font-weight: 600;
            font-size: clamp(2.2rem, 7vw, 4rem);
            line-height: 1.2;
            margin: 18px 0 14px;
            color: var(--moon);
            text-shadow: 0 0 40px rgba(255, 232, 182, .35);
        }

        .names {
            font-family: "Lora", serif;
            font-size: clamp(1.1rem, 3vw, 1.4rem);
            color: var(--rose);
        }

        /* Mười một vầng trăng */
        .moons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 14px 12px;
            margin: 56px auto 22px;
            max-width: 640px;
        }

        .moon {
            background: none;
            border: 0;
            cursor: pointer;
            padding: 4px;
            border-radius: 50%;
            transition: transform .25s ease;
        }

        .moon svg {
            display: block;
            width: 46px;
            height: 46px;
        }

        .moon:hover {
            transform: translateY(-4px);
        }

        .moon:focus-visible {
            outline: 2px solid var(--rose);
            outline-offset: 3px;
        }

        .moon[aria-pressed="true"] {
            transform: scale(1.18);
        }

        .moon[aria-pressed="true"] svg {
            filter: drop-shadow(0 0 10px rgba(255, 232, 182, .75));
        }

        .moon.last svg {
            animation: glow 2.8s ease-in-out infinite;
        }

        @keyframes glow {

            0%,
            100% {
                filter: drop-shadow(0 0 6px rgba(255, 232, 182, .45));
            }

            50% {
                filter: drop-shadow(0 0 18px rgba(255, 232, 182, .95));
            }
        }

        .note {
            min-height: 108px;
            max-width: 520px;
            margin: 0 auto;
        }

        .note h2 {
            font-family: "Lora", serif;
            font-style: italic;
            font-weight: 500;
            font-size: 1.25rem;
            color: var(--moon);
            margin-bottom: 8px;
        }

        .note p {
            font-size: 1.05rem;
            line-height: 1.75;
            color: var(--text);
        }

        /* Bộ đếm */
        .counter {
            margin: 48px auto 0;
            padding: 28px 20px;
            max-width: 620px;
            border: 1px solid rgba(203, 188, 242, .28);
            border-radius: 22px;
            background: rgba(44, 26, 77, .45);
            backdrop-filter: blur(6px);
        }

        .counter .lead {
            color: var(--mist);
            font-size: .98rem;
            margin-bottom: 16px;
        }

        .units {
            display: flex;
            justify-content: center;
            gap: clamp(14px, 5vw, 38px);
        }

        .unit b {
            display: block;
            font-family: "Lora", serif;
            font-weight: 500;
            font-size: clamp(1.8rem, 6vw, 2.8rem);
            color: var(--moon);
            font-variant-numeric: tabular-nums;
        }

        .unit span {
            font-size: .85rem;
            color: var(--mist);
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 14px;
            margin-top: 44px;
        }

        button.btn {
            font: inherit;
            font-weight: 400;
            font-size: 1rem;
            cursor: pointer;
            padding: 13px 26px;
            border-radius: 999px;
            border: 1px solid var(--rose);
            color: var(--text);
            background: transparent;
            transition: background .25s, color .25s, transform .2s;
        }

        button.btn.primary {
            background: var(--rose);
            color: #3a1230;
            border-color: var(--rose);
        }

        button.btn:hover {
            transform: translateY(-2px);
        }

        button.btn:not(.primary):hover {
            background: rgba(255, 143, 163, .15);
        }

        button.btn:focus-visible {
            outline: 2px solid var(--moon);
            outline-offset: 3px;
        }

        /* Lá thư */
        dialog {
            margin: auto;
            width: min(92vw, 560px);
            max-height: 86vh;
            overflow: auto;
            border: 1px solid rgba(255, 232, 182, .35);
            border-radius: 20px;
            padding: 36px 30px 28px;
            background: linear-gradient(180deg, #2f1d55, #231640);
            color: var(--text);
        }

        dialog::backdrop {
            background: rgba(10, 6, 24, .72);
        }

        dialog h3 {
            font-family: "Lora", serif;
            font-style: italic;
            font-weight: 600;
            font-size: 1.5rem;
            color: var(--moon);
            margin-bottom: 16px;
        }

        dialog p {
            line-height: 1.85;
            margin-bottom: 14px;
            white-space: pre-line;
        }

        dialog .sign {
            font-family: "Lora", serif;
            font-style: italic;
            color: var(--rose);
            text-align: right;
            margin-top: 8px;
        }

        dialog form {
            text-align: center;
            margin-top: 18px;
        }

        button.btn.small {
            padding: 9px 20px;
            font-size: .95rem;
        }

        /* Album */
        dialog.wide {
            width: min(94vw, 880px);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
            margin: 6px 0 18px;
        }

        .tile {
            position: relative;
            aspect-ratio: 1;
            border-radius: 14px;
            overflow: hidden;
            padding: 0;
            cursor: pointer;
            border: 1px solid rgba(203, 188, 242, .3);
            background: rgba(58, 42, 98, .6);
            color: var(--mist);
            font: inherit;
            transition: transform .25s ease, border-color .25s;
        }

        .tile:hover {
            transform: translateY(-3px);
            border-color: var(--rose);
        }

        .tile:focus-visible {
            outline: 2px solid var(--rose);
            outline-offset: 3px;
        }

        .tile img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .tile .empty {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: .85rem;
        }

        .tile .empty i {
            font-style: normal;
            font-size: 1.6rem;
            color: var(--rose);
            opacity: .7;
        }

        .hint {
            font-size: .88rem;
            color: var(--mist);
            line-height: 1.6;
            margin-bottom: 8px;
        }

        /* Xem ảnh lớn */
        #viewer {
            width: min(96vw, 960px);
            padding: 18px;
            background: #160d28;
        }

        #viewer .stage {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 40vh;
        }

        #viewer img {
            max-width: 100%;
            max-height: 72vh;
            border-radius: 12px;
            display: block;
        }

        #viewer .bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 14px;
            color: var(--mist);
        }

        footer {
            margin-top: 56px;
            color: var(--mist);
            font-size: .9rem;
        }

        @media (max-width: 480px) {
            .moon svg {
                width: 38px;
                height: 38px;
            }

            main {
                padding-top: 56px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .moon.last svg {
                animation: none;
            }

            * {
                transition: none !important;
            }
        }
    </style>
</head>

<body>
    <canvas id="sky" aria-hidden="true"></canvas>

    <main>
        <p class="date" id="dateLine"></p>
        <h1>Tháng thứ mười một<br>chúng mình iu nhau</h1>
        <p class="names" id="names"></p>

        <div class="moons" id="moons" role="group" aria-label="Mười một tháng yêu nhau"></div>
        <div class="note" id="note" aria-live="polite"></div>

        <section class="counter">
            <p class="lead">Từ ngày mình bắt đầu đến giờ phút này</p>
            <div class="units">
                <div class="unit"><b id="d">0</b><span>ngày</span></div>
                <div class="unit"><b id="h">0</b><span>giờ</span></div>
                <div class="unit"><b id="m">0</b><span>phút</span></div>
                <div class="unit"><b id="s">0</b><span>giây</span></div>
            </div>
        </section>

        <div class="actions">
            <button class="btn primary" id="openLetter">Mở lá thư</button>
            <button class="btn" id="openAlbum">Album ảnh</button>
            <button class="btn" id="hearts">Thả tim</button>
        </div>

        <footer>Gửi người mình thương, ngày 13/10</footer>
    </main>

    <dialog id="letter">
        <h3 id="letterTitle"></h3>
        <div id="letterBody"></div>
        <p class="sign" id="letterSign"></p>
        <div style="text-align:center;margin-top:18px">
            <button type="button" class="btn primary" data-close="letter">Đóng thư</button>
        </div>
    </dialog>

    <dialog id="album" class="wide">
        <h3>Album cụa cục cưng</h3>
        <p class="hint">hog thíc ảnh hoàn chỉnh, a chỉ thíc mấy tấm như này thoy :3</p>
        <div class="grid" id="grid"></div>
        <div style="text-align:center">
            <button type="button" class="btn primary" data-close="album">Đóng album</button>
        </div>
    </dialog>

    <dialog id="viewer">
        <div class="stage"><img id="big" alt=""></div>
        <div class="bar">
            <button type="button" class="btn small" id="prev">Trước</button>
            <span id="count"></span>
            <button type="button" class="btn small" id="next">Sau</button>
            <button type="button" class="btn small primary" data-close="viewer">Đóng</button>
        </div>
    </dialog>

    <script>
        /* ============ CHỈNH SỬA PHẦN NÀY ============ */
        const CONFIG = {
            me: "aiu",                       // cách xưng của bạn
            you: "eiu",                       // cách gọi người ấy
            startDate: "2025-11-13T00:00:00", // ngày bắt đầu yêu (13/11/2025 -> 13/10/2026 tròn 11 tháng)
            anniversaryLabel: "13 tháng 10 năm 2026",

            // 11 lời nhắn, mỗi tháng một vầng trăng. Hãy thay bằng kỷ niệm thật của hai bạn.
            months: [
                "Những ngày đầu còn ngại ngùng, nhưng tim đã biết đường rồi.",
                "Mình có những lần giận dỗi nhau đầu tin cũng vì ngày kỉ nịm này",
                "Lần đầu anh hiểu thế nào là nhớ một người.",
                "NHỚ IEM IU",
                "Mình cãi nhau một chút, rồi thương nhau nhiều hơn.",
                "Nửa năm, đủ để biết mình chọn đúng người.",
                "Có eiu, ngày thường cũng thành ngày đặc biệt.",
                "Mình học cách lắng nghe và nhường nhau.",
                "Bé à đừn có quậy nữa nha",
                "Mười tháng, và aiu vẫn thấy may mắn như ngày đầu.",
                "Mười một tháng. Vầng trăng tròn nhất, vì có eiu ở bên.... chờ đợi chu kỳ típ theo"
            ],

            letter: {
                title: "Gửi eiu của tui",
                body: "Mười một tháng trôi qua nhanh như một cái chớp mắt, mà cũng dài đủ để anh biết mình muốn ở cạnh bé lâu thật lâu.\n\nCảm ơn eiu vì đã kiên nhẫn với những lúc anh vụng về, vì những cái ôm đúng lúc, và vì luôn là nơi a muốn trở về sau mỗi ngày.\n\nChúc mừng chúng mình, tháng thứ mười một. Mong sẽ còn thật nhiều tháng nữa như thế.",
                sign: "Yêu cục cơt nhìu !!!!!"
            }
        };
        /* ============================================ */

        const $ = (id) => document.getElementById(id);
        const total = CONFIG.months.length;

        $("dateLine").textContent = CONFIG.anniversaryLabel;
        $("names").textContent = CONFIG.me + " và " + CONFIG.you;

        /* Vẽ vầng trăng: tháng càng lớn, trăng càng đầy */
        function moonSVG(i) {
            const r = 20, p = (i + 1) / total, shift = p * r * 2.15;
            return `<svg viewBox="0 0 46 46" aria-hidden="true">
    <defs><clipPath id="c${i}"><circle cx="23" cy="23" r="${r}"/></clipPath></defs>
    <circle cx="23" cy="23" r="${r}" fill="var(--dim)"/>
    <circle cx="23" cy="23" r="${r}" fill="var(--moon)" clip-path="url(#c${i})"/>
    <circle cx="${23 + shift}" cy="23" r="${r}" fill="var(--dim)" clip-path="url(#c${i})"/>
  </svg>`;
        }

        const moonsEl = $("moons");
        function select(i) {
            [...moonsEl.children].forEach((b, k) => b.setAttribute("aria-pressed", k === i));
            $("note").innerHTML = `<h2>Tháng thứ ${i + 1}</h2><p></p>`;
            $("note").querySelector("p").textContent = CONFIG.months[i];
        }
        CONFIG.months.forEach((_, i) => {
            const b = document.createElement("button");
            b.className = "moon" + (i === total - 1 ? " last" : "");
            b.setAttribute("aria-label", "Tháng thứ " + (i + 1));
            b.innerHTML = moonSVG(i);
            b.addEventListener("click", () => select(i));
            moonsEl.appendChild(b);
        });
        select(total - 1);

        /* Bộ đếm thời gian */
        const start = new Date(CONFIG.startDate).getTime();
        function tick() {
            let diff = Math.max(0, Date.now() - start);
            const d = Math.floor(diff / 864e5); diff -= d * 864e5;
            const h = Math.floor(diff / 36e5); diff -= h * 36e5;
            const m = Math.floor(diff / 6e4); diff -= m * 6e4;
            const s = Math.floor(diff / 1e3);
            $("d").textContent = d.toLocaleString("vi-VN");
            $("h").textContent = h; $("m").textContent = m; $("s").textContent = s;
        }
        tick(); setInterval(tick, 1000);

        /* Lá thư */
        $("letterTitle").textContent = CONFIG.letter.title;
        $("letterSign").textContent = CONFIG.letter.sign;
        CONFIG.letter.body.split("\n\n").forEach((t) => {
            const p = document.createElement("p"); p.textContent = t; $("letterBody").appendChild(p);
        });
        $("openLetter").addEventListener("click", () => { $("letter").showModal(); burst(18); });

        /* Đóng hộp thoại: nút Đóng, bấm ra ngoài hoặc phím Esc */
        document.querySelectorAll("[data-close]").forEach((b) =>
            b.addEventListener("click", () => $(b.dataset.close).close()));
        document.querySelectorAll("dialog").forEach((dlg) =>
            dlg.addEventListener("click", (e) => { if (e.target === dlg) dlg.close(); }));

        /* Album ảnh: tự tìm anh1 ... anh10 với các đuôi file phổ biến */
        const PHOTO_COUNT = 10;
        const EXTS = ["jpg", "jpeg", "png", "webp", "JPG", "JPEG", "PNG", "webp"];
        const photos = Array.from({ length: PHOTO_COUNT }, (_, i) => ({ name: "anh" + (i + 1), src: null }));

        function findPhoto(photo, tile) {
            let k = 0;
            const probe = new Image();
            probe.onload = () => {
                photo.src = probe.src;
                tile.innerHTML = "";
                const img = document.createElement("img");
                img.src = photo.src; img.alt = "Ảnh " + photo.name.slice(3); img.loading = "lazy";
                tile.appendChild(img);
            };
            probe.onerror = () => { if (++k < EXTS.length) probe.src = photo.name + "." + EXTS[k]; };
            probe.src = photo.name + "." + EXTS[0];
        }
        const grid = $("grid");
        photos.forEach((ph, i) => {
            const t = document.createElement("button");
            t.type = "button"; t.className = "tile"; t.setAttribute("aria-label", "Xem ảnh " + (i + 1));
            t.innerHTML = `<span class="empty"><i>♥</i>${ph.name}</span>`;
            t.addEventListener("click", () => { if (ph.src) openViewer(i); });
            grid.appendChild(t);
            findPhoto(ph, t);
        });
        $("openAlbum").addEventListener("click", () => { $("album").showModal(); burst(14); });

        let cur = 0;
        function loaded() { return photos.map((p, i) => (p.src ? i : -1)).filter((i) => i >= 0); }
        function show(i) {
            cur = i; $("big").src = photos[i].src;
            const list = loaded();
            $("count").textContent = (list.indexOf(i) + 1) + " / " + list.length;
        }
        function openViewer(i) { show(i); $("viewer").showModal(); }
        function step(d) {
            const list = loaded(); if (!list.length) return;
            show(list[(list.indexOf(cur) + d + list.length) % list.length]);
        }
        $("prev").addEventListener("click", () => step(-1));
        $("next").addEventListener("click", () => step(1));
        addEventListener("keydown", (e) => {
            if (!$("viewer").open) return;
            if (e.key === "ArrowLeft") step(-1);
            if (e.key === "ArrowRight") step(1);
        });

        /* Cánh hoa rơi và tim bay */
        const cv = $("sky"), ctx = cv.getContext("2d");
        const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
        let W, H, dpr, petals = [], hearts = [];
        function resize() {
            dpr = Math.min(devicePixelRatio || 1, 2);
            W = innerWidth; H = innerHeight;
            cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        addEventListener("resize", resize); resize();

        const rnd = (a, b) => a + Math.random() * (b - a);
        function newPetal(top) {
            return {
                x: rnd(0, W), y: top ? rnd(-H, 0) : rnd(0, H), s: rnd(5, 11), vy: rnd(.25, .7),
                vx: rnd(-.2, .3), a: rnd(0, 6.28), va: rnd(-.015, .015), o: rnd(.25, .6)
            };
        }
        if (!reduce) petals = Array.from({ length: 36 }, () => newPetal(false));

        function drawHeart(x, y, s, color, alpha) {
            ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.globalAlpha = alpha; ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(0, .35);
            ctx.bezierCurveTo(-1.1, -.4, -.5, -1.1, 0, -.5);
            ctx.bezierCurveTo(.5, -1.1, 1.1, -.4, 0, .35);
            ctx.fill(); ctx.restore();
        }
        function burst(n) {
            if (reduce) return;
            for (let i = 0; i < n; i++) {
                hearts.push({
                    x: rnd(W * .15, W * .85), y: H + 20, s: rnd(10, 24), vy: rnd(1.2, 3), vx: rnd(-.6, .6),
                    o: 1, c: Math.random() > .4 ? "#ff8fa3" : "#ffe8b6"
                });
            }
        }
        $("hearts").addEventListener("click", () => { if (reduce) { alert("Aiu yêu eiu nhiều lắm!"); } burst(40); });

        function frame() {
            ctx.clearRect(0, 0, W, H);
            for (const p of petals) {
                p.y += p.vy; p.x += p.vx + Math.sin(p.a) * .3; p.a += p.va;
                if (p.y > H + 20) Object.assign(p, newPetal(true), { y: -20 });
                ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.globalAlpha = p.o; ctx.fillStyle = "#ff8fa3";
                ctx.beginPath(); ctx.ellipse(0, 0, p.s, p.s * .55, 0, 0, 6.28); ctx.fill(); ctx.restore();
            }
            hearts = hearts.filter((h) => h.o > 0.02);
            for (const h of hearts) {
                h.y -= h.vy; h.x += h.vx; h.o -= 0.004;
                drawHeart(h.x, h.y, h.s, h.c, Math.max(h.o, 0));
            }
            requestAnimationFrame(frame);
        }
        frame();

        /* Đúng ngày 13/10 thì tự thả tim khi mở trang */
        const now = new Date();
        if (now.getDate() === 13 && now.getMonth() === 9) setTimeout(() => burst(50), 800);
    </script>
</body>

</html>
